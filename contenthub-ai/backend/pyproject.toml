[project]
name = "contenthub-ai-backend"
version = "0.1.0"
description = "ContentHub AI FastAPI backend (modular monolith)"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "mysql: live MySQL integration tests requiring CONTENTHUB_TEST_DATABASE_URL",
]
addopts = "-ra"
